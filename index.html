<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CONDOGAME — Server Game</title>
  <style>
    /* ===== RESET & BASICS ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    :root {
      --bg-body: #fff0f5;
      --bg-card: #ffffff;
      --text-main: #333333;
      --text-muted: #777777;
      --accent-gradient: linear-gradient(135deg, #ff66b2, #ff99cc);
      --border-color: #ffb6c1;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 70px;
      padding-bottom: 90px;
    }

    .app-container {
      max-width: 600px;
      width: 100%;
      padding: 10px 20px 20px 20px;
    }

    /* ===== TOP HEADER (FIXED & BLUR) ===== */
    .top-header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      display: flex;
      justify-content: center;
      background: rgba(255, 240, 245, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
    }
    
    .header-content {
      max-width: 600px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: white;
    }

    .logo-area h1 {
      font-size: 1rem;
      font-weight: 800;
      color: #d63384;
      letter-spacing: 0.5px;
    }

    .btn-verify {
      background: var(--accent-gradient);
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(255, 102, 178, 0.3);
    }
    .btn-verify svg { width: 14px; height: 14px; fill: white; }

    /* ===== TABS CONTENT ===== */
    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== GAMES TAB ===== */
    .search-bar {
      background-color: var(--bg-card);
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(255, 182, 193, 0.1);
    }
    
    .search-bar input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-main);
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar svg { width: 18px; height: 18px; stroke: var(--text-muted); }

    /* FILTER CHIPS */
    .filter-chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 25px;
      padding-bottom: 5px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    
    .chip {
      background-color: var(--bg-card);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip.active {
      background: var(--accent-gradient);
      color: white;
      border: none;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(255, 102, 178, 0.2);
    }

    .section-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      font-weight: 600;
    }

    /* GAME CARD */
    .game-card {
      background-color: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2);
      position: relative;
      animation: fadeIn 0.4s ease;
    }

    .media-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
    }

    .media-wrapper video, .media-wrapper img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .tag {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      color: white;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .featured-badge {
      position: absolute;
      top: 15px; right: 15px;
      width: 30px;
      height: 30px;
    }
    .featured-badge svg {
      width: 100%; height: 100%;
      fill: #ff3385;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .card-body {
      padding: 20px;
    }

    .game-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: #d63384;
    }

    /* ===== NEW ROW FOR DESC & AVATARS ===== */
    .card-content-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 15px;
    }

    .game-desc {
      flex: 1;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ===== STATIC OVERLAPPING AVATARS (RIGHT SIDE) ===== */
    .active-players {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .avatar-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      margin-left: -12px;
      border-radius: 50%;
      border: 2px solid #ff99cc;
      background-color: #f8f9fa;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      animation: popIn 0.3s ease;
    }
    
    .avatar-wrapper:first-child { margin-left: 0; }

    .avatar-wrapper:hover {
      transform: translateY(-5px);
      z-index: 10;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* YELLOW STATUS DOT */
    .status-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background-color: #facc15; /* Kuning Terang */
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(250, 204, 21, 0.6);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Tombol Play */
    .btn-play {
      width: 100%;
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
      box-shadow: 0 4px 15px rgba(255, 102, 178, 0.3);
    }
    .btn-play:active { transform: scale(0.98); }
    .btn-play svg { width: 18px; height: 18px; stroke-width: 2.5; }

    /* ===== FAQ TAB ===== */
    .faq-card {
      background-color: var(--bg-card);
      border-radius: 20px;
      padding: 30px 20px;
      border: 1px solid var(--border-color);
      text-align: center;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2);
    }

    .faq-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #f8f9fa;
      margin: 0 auto 15px auto;
      border: 3px solid #ff99cc;
      overflow: hidden;
    }

    .faq-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .faq-name { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; color: #d63384; }
    .faq-username { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
    .faq-bio { font-size: 0.95rem; color: #666; font-style: italic; margin-bottom: 25px; padding: 0 10px; }

    .faq-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      padding: 20px 0;
      border-top: 1px solid #ffe6f0;
      border-bottom: 1px solid #ffe6f0;
    }

    .stat-box { display: flex; flex-direction: column; }
    .stat-box .val { font-size: 1.2rem; font-weight: 800; color: #ff3385; }
    .stat-box .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .btn-add-friend {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #00d2ff;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 15px;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-add-friend:hover { background: #00b8e6; }
    .btn-add-friend:active { transform: scale(0.98); }

    /* ===== BOTTOM NAVIGATION ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      border-top: 1px solid #ffe6f0;
      z-index: 1000;
      box-shadow: 0 -4px 15px rgba(255, 182, 193, 0.15);
    }

    .nav-container {
      max-width: 600px; width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.8rem; font-weight: 600; gap: 5px;
      cursor: pointer; padding: 8px 40px; border-radius: 20px;
      transition: all 0.3s;
    }

    .nav-item.active {
      color: white;
      background: var(--accent-gradient);
      box-shadow: 0 4px 10px rgba(255, 102, 178, 0.3);
    }

    .nav-icon { width: 20px; height: 20px; fill: currentColor; }

    /* ===== PRELOADER ===== */
    #preloader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #fff0f5; display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.6s ease;
    }
    #preloader.fade-out { opacity: 0; pointer-events: none; }
    .loader-text {
      font-size: 2.2rem; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(135deg, #ff66b2, #ff99cc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 25px;
    }
    .progress-bar-container {
      width: 80%; max-width: 300px; height: 10px; background: #ffe6f0;
      border-radius: 5px; overflow: hidden; margin-bottom: 15px; box-shadow: inset 0 2px 4px rgba(255, 102, 178, 0.2);
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ff66b2, #ff99cc);
      border-radius: 5px; transition: width 0.1s linear;
    }
    .loading-log {
      font-size: 0.85rem; color: #d63384; font-family: 'Courier New', Courier, monospace;
      height: 20px; text-align: center; letter-spacing: 1px;
    }
  </style>
</head>

  <!-- TOP HEADER (FIXED) -->
  <header class="top-header">

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

  <script>
    // ===== PRELOADER LOGIC =====
    const preloader = document.getElementById('preloader');
    const progressBar = document.getElementById('progressBar');
    const logText = document.getElementById('loadingLog');
    
    const duration = 8000; 
    const intervalTime = 50; 
    const step = (100 / (duration / intervalTime)); 
    
    let progress = 0;

    const messages = [
      { threshold: 0, text: "Initializing website..." },
      { threshold: 20, text: "Loading assets..." },
      { threshold: 40, text: "Connecting to servers..." },
      { threshold: 60, text: "Fetching players..." },
      { threshold: 80, text: "Preparing interface..." },
      { threshold: 95, text: "Almost ready..." }
    ];

    const progressInterval = setInterval(() => {
      progress += step;
      
      if (progress >= 100) {
        progress = 100;
        clearInterval(progressInterval);
        
        logText.textContent = "Ready!";
        
        setTimeout(() => {
          preloader.classList.add('fade-out');
          setTimeout(() => {
            preloader.remove();
          }, 600); 
        }, 500); 
      }

      progressBar.style.width = `${progress}%`;

      for (let i = messages.length - 1; i >= 0; i--) {
        if (progress >= messages[i].threshold) {
          if (logText.textContent !== messages[i].text) {
            logText.textContent = messages[i].text;
          }
          break;
        }
      }
    }, intervalTime);

    // ===== TAB SWITCHING LOGIC =====
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      element.classList.add('active');
    }

    // ===== DATA GAMES =====
    const gamesData = [
      {
        id: 'server1',
        title: 'New Server Condo 1',
        genre: 'Romance',
        desc: "Step into the ultimate romance experience. Find your match and vibe with others! ❤️",
        video: 'https://i.imgur.com/mDMLR61.mp4',
        link: 'https://g5.lu/t6vgf'
      },
      {
        id: 'server2',
        title: 'New Server Condo 2',
        genre: 'Roleplay',
        desc: "Meet Emiko, your perfect AI companion. Chat, play, and explore a whole new world together! ✨",
        video: 'https://i.imgur.com/a40LH9A.mp4',
        link: 'https://g5.lu/dd87v'
      },
      {
        id: 'server3',
        title: 'New Server Condo 3',
        genre: 'Action',
        desc: "Join the baddest crew in town. Epic hangouts, wild vibes, and non-stop action awaits! 🔥",
        video: 'https://i.imgur.com/GjgpaRz.mp4',
        link: 'https://g5.lu/heebg'
      }
    ];

    // Avatar generator
    const robloxAvatars = [
      'https://postimg.cc/v4jLWXZC', 
      'https://postimg.cc/4KkHf0dY', 
      'https://postimg.cc/5YpXmNSD', 
      'https://postimg.cc/sGXvHdnw'  
    ];

    // Menghasilkan HTML untuk avatar (3-4 orang)
    function generateAvatarHTML() {
      let html = '';
      const count = Math.floor(Math.random() * 2) + 3; // 3 atau 4 avatar
      for(let i=0; i<count; i++) {
        const randomImg = robloxAvatars[Math.floor(Math.random() * robloxAvatars.length)];
        html += `
          <div class="avatar-wrapper">
            <img src="${randomImg}" class="avatar-img" alt="Player">
            <span class="status-dot"></span>
          </div>
        `;
      }
      return html;
    }

    // Render Games
    let currentGenre = 'All';

    function renderGames(gamesToRender) {
      const container = document.getElementById('gamesContainer');
      const countTitle = document.getElementById('gameCount');
      
      container.innerHTML = '';
      countTitle.textContent = `${gamesToRender.length} games available`;

      if (gamesToRender.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">No games found.</div>`;
        return;
      }

      gamesToRender.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="media-wrapper">
            <span class="tag">${game.genre}</span>
            <div class="featured-badge">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </div>
            <video src="${game.video}" autoplay loop muted playsinline></video>
          </div>
          <div class="card-body">
            <div class="game-title">${game.title}</div>
            
            <!-- Baris Konten: Deskripsi di Kiri, Avatar di Kanan -->
            <div class="card-content-row">
              <div class="game-desc">${game.desc}</div>
              <div class="active-players">
                ${generateAvatarHTML()}
              </div>
            </div>

            <button class="btn-play" onclick="joinRobloxServer('${game.link}')">
              Play now 
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Filter Functions
    function filterGames() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = gamesData.filter(game => {
        const matchesSearch = game.title.toLowerCase().includes(searchText) || game.genre.toLowerCase().includes(searchText) || game.desc.toLowerCase().includes(searchText);
        const matchesGenre = (currentGenre === 'All') || (game.genre === currentGenre);
        return matchesSearch && matchesGenre;
      });

      renderGames(filtered);
    }

    function filterGenre(genre, element) {
      document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
      element.classList.add('active');
      currentGenre = genre;
      filterGames();
    }

    // Initial Render
    renderGames(gamesData);

    // ===== AVATAR LOOPING (BERGANTI SETIAP 4 DETIK) =====
    setInterval(() => {
      // Cari semua kontainer avatar di layar dan perbarui isinya
      const avatarContainers = document.querySelectorAll('.active-players');
      avatarContainers.forEach(container => {
        container.innerHTML = generateAvatarHTML();
      });
    }, 4000);

    // ===== REDIRECT TO ROBLOX =====
    function joinRobloxServer(targetUrl) {
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        const cleanUrl = targetUrl.replace(/^https?:\/\//, '');
        const fallbackUrl = encodeURIComponent(targetUrl);
        const chromeIntentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallbackUrl};end`;
        window.location.href = chromeIntentUrl;
      } else {
        window.open(targetUrl, '_blank');
      }
    }
  </script>

</body>
</html>
